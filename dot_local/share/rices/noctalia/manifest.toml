[metadata]
author = "Kanapech"
version = "0.1.0"
description = "Noctalia shell, both Hyprland and Umbriel compatible (bar, launcher, notifications, lock)"

[inherit]
base = "base"

[symlinks]
"noctalia" = "~/.config/noctalia"

[validate]
lua = "luac -p hypr/*.lua"
noctalia = "noctalia config validate noctalia/"
